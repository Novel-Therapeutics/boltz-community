name: GPU Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gpu-tests:
    name: GPU tests
    # Create this runner in repo Settings > Actions > Runners > New GitHub-hosted runner:
    #   Image: Partner tab > "NVIDIA GPU-Optimized Image for AI and HPC"
    #   Size: GPU-powered tab > 4-core with T4 GPU
    #   Name: gpu-t4
    runs-on: gpu-t4
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # PyTorch 2.15's CUDA 13.2 wheels retain T4 (sm_75) support. The runner
      # image must provide a driver compatible with CUDA 13.2.
      - name: Install PyTorch CUDA build
        run: python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cu132

      - name: Install dependencies
        run: |
          python -m pip install -e ".[test,cuda]"
          python -m pip check

      - name: Show GPU stack
        run: |
          python - <<'PY'
          import sys
          import torch

          print(sys.version)
          print("torch", torch.__version__)
          print("torch cuda", torch.version.cuda)
          print("cuda available", torch.cuda.is_available())
          assert sys.version_info[:2] == (3, 14)
          assert torch.__version__.split("+")[0] == "2.15.0"
          assert torch.version.cuda == "13.2"
          assert torch.cuda.is_available()
          PY
          nvidia-smi

      - name: Cache model checkpoints
        uses: actions/cache@v6
        with:
          path: ~/.boltz
          key: boltz-checkpoints-v1

      - name: Run GPU tests
        run: pytest -m "slow or regression" -v --tb=short
