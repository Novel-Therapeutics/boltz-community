name: CPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-tests:
    name: CPU tests (Python ${{ matrix.python }}, PyTorch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            torch: "2.15.0"
          - python: "3.14"
            torch: "2.10.0"
          # Exercise the Python and PyTorch minimums together.
          - python: "3.11"
            torch: "2.10.0"
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      TORCH_VERSION: ${{ matrix.torch }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyTorch CPU build
        run: python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Check runtime and dependencies
        run: |
          python -c "import os, sys, torch; print(sys.version); print('torch', torch.__version__); assert '.'.join(map(str, sys.version_info[:2])) == os.environ['PYTHON_VERSION']; assert torch.__version__.split('+')[0] == os.environ['TORCH_VERSION']"
          python -m pip check

      - name: Run CPU tests
        run: python -m pytest -m "not slow and not regression and not cuda and not mps and not xpu" -v --tb=short
