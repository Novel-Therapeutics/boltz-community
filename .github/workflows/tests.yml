name: CPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TORCH_VERSION: "2.15.0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PyTorch CPU build
        run: python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Check runtime and dependencies
        run: |
          python -c "import os, sys, torch; print(sys.version); print('torch', torch.__version__); assert sys.version_info[:2] == (3, 14); assert torch.__version__.split('+')[0] == os.environ['TORCH_VERSION']"
          python -m pip check

      - name: Run CPU tests
        run: python -m pytest -m "not slow and not regression and not cuda and not mps and not xpu" -v --tb=short
